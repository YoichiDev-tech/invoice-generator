name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        continue-on-error: true
        run: |
          npm audit --omit=dev --json > npm-audit.json || true
          node -e 'const r = JSON.parse(require("node:fs").readFileSync("npm-audit.json", "utf8")); console.log(JSON.stringify(r.metadata?.vulnerabilities ?? {}, null, 2)); for (const [name, v] of Object.entries(r.vulnerabilities ?? {})) console.log(name + ": " + v.severity + "; direct=" + v.isDirect + "; fix=" + JSON.stringify(v.fixAvailable) + "; " + v.via.map(x => typeof x === "string" ? x : x.title).join(", "));'
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
